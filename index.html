<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liste Numéro</title>

    <link rel="stylesheet" href="style.css">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<header class="header">

    <div class="brand">
        <div class="logo">
            <i class="fa-solid fa-address-book"></i>
        </div>

        <div>
            <h1>Liste Numéro</h1>
            <p>Andiam-pitory</p>
        </div>
    </div>

    <div class="total">
        <span id="totalContacts">0</span>
        <small>Contacts</small>
    </div>

</header>


<main class="container">

    <!-- SEARCH -->

    <div class="search-box">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            type="text"
            id="search"
            placeholder="Mitadiava anarana..."
        >

    </div>


    <!-- FILTERS -->

    <div class="filters">

        <select id="groupFilter">

            <option value="Tous">👥 Andiam-pitory rehetra</option>

            <option value="Ndremanga">Ndremanga</option>
            <option value="Ndretiana">Ndretiana</option>
            <option value="Tojo">Tojo</option>
            <option value="Samuel">Samuel</option>
            <option value="Johary">Johary</option>

        </select>


        <select id="sort">

            <option value="az">A → Z</option>
            <option value="za">Z → A</option>

        </select>

    </div>


    <!-- CONTACTS -->

    <div id="contacts" class="contacts"></div>

</main>


<script src="contacts.js"></script>

<script>

const contactsContainer =
    document.getElementById("contacts");

const search =
    document.getElementById("search");

const groupFilter =
    document.getElementById("groupFilter");

const sort =
    document.getElementById("sort");

const totalContacts =
    document.getElementById("totalContacts");


function displayContacts() {

    let result = [...contacts];

    const searchText =
        search.value.toLowerCase().trim();

    const group =
        groupFilter.value;


    // SEARCH

    if (searchText !== "") {

        result = result.filter(contact =>
            contact.nom.toLowerCase().includes(searchText)
        );

    }


    // FILTER GROUP

    if (group !== "Tous") {

        result = result.filter(contact =>
            contact.groupe === group
        );

    }


    // SORT

    result.sort((a, b) => {

        return sort.value === "az"
            ? a.nom.localeCompare(b.nom)
            : b.nom.localeCompare(a.nom);

    });


    totalContacts.textContent = result.length;


    // EMPTY

    if (result.length === 0) {

        contactsContainer.innerHTML = `
            <div class="empty">
                <i class="fa-solid fa-user-slash"></i>
                <h3>Tsy misy contact</h3>
                <p>Tsy nahitana olona mifanaraka.</p>
            </div>
        `;

        return;

    }


    contactsContainer.innerHTML = result.map(contact => {

        const phone =
            contact.numero.replace(/\s/g, "");

        return `

        <div class="card">

            <img
                src="${contact.photo}"
                alt="${contact.nom}"
                class="photo"
                onerror="this.src='https://via.placeholder.com/150?text=Photo'"
            >

            <div class="info">

                <h2>${contact.nom}</h2>

                <div class="number">
                    <i class="fa-solid fa-phone"></i>
                    ${contact.numero}
                </div>

                <div class="group">
                    <i class="fa-solid fa-users"></i>
                    ${contact.groupe}
                </div>


                <div class="actions">

                    <!-- APPEL -->

                    <a
                        href="tel:${phone}"
                        class="action call"
                        title="Appeler"
                    >
                        <i class="fa-solid fa-phone"></i>
                    </a>


                    <!-- SMS -->

                    <a
                        href="sms:${phone}"
                        class="action sms"
                        title="SMS"
                    >
                        <i class="fa-solid fa-message"></i>
                    </a>


                    <!-- WHATSAPP -->

                    <a
                        href="https://wa.me/261${phone.substring(1)}"
                        target="_blank"
                        class="action whatsapp"
                        title="WhatsApp"
                    >
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>


                    <!-- TELEGRAM -->

                    <a
                        href="https://t.me/+261${phone.substring(1)}"
                        target="_blank"
                        class="action telegram"
                        title="Telegram"
                    >
                        <i class="fa-brands fa-telegram"></i>
                    </a>

                </div>

            </div>

        </div>

        `;

    }).join("");

}


search.addEventListener("input", displayContacts);

groupFilter.addEventListener("change", displayContacts);

sort.addEventListener("change", displayContacts);

</body>
</html>
